# src/test/resources/application.properties
# Use in-memory H2 for tests so context loads without external PostgreSQL credentials
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create and drop schema during tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Minimal jwt values so JwtUtil can initialize in tests
jwt.secretKey=ZmFrZV9zZWNyZXRfZm9yX3Rlc3Q=
jwt.expirationTime=3600000

# Disable external integrations in tests if necessary (optional)
aws.s3.bucket-name=test-bucket
aws.access-key-id=test
aws.secret-access-key=test
aws.region=eu-north-1

spring.mail.host=localhost
spring.mail.port=25

# Disable OAuth2 client registration so the bean isn't required
spring.security.oauth2.client.registration[0].client-id=test
spring.security.oauth2.client.registration[0].client-secret=test
spring.security.oauth2.client.registration[0].provider=google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
