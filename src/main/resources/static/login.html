<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShareMyNotes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container" style="max-width: 800px; margin-top: 50px;">
    <div class="text-center" style="margin-bottom: 30px;">
        <h1>📝 ShareMyNotes</h1>
        <p>Login or Register to access the platform</p>
    </div>

    <div class="card auth-container">
        <div class="auth-box">
            <h3>Login</h3>
            <form id="loginForm">
                <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
                <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
                <button type="submit">Login</button>
            </form>
        </div>
        <div class="auth-box divider">
            <h3>Register</h3>
            <form id="registerForm">
                <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
                <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
                <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="6"></div>
                <button type="submit" class="secondary">Register</button>
            </form>
        </div>
    </div>
    <div class="card text-center">
        <h3>Or Login with OAuth2</h3>
        <div class="oauth-buttons">
            <a href="http://localhost:8080/oauth2/authorization/google" class="btn btn-google">Google</a>
            <a href="http://localhost:8080/oauth2/authorization/github" class="btn btn-github">GitHub</a>
        </div>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
