<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - ShareMyNotes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <nav class="navbar">
        <h1>📝 ShareMyNotes</h1>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="upload.html">Upload Note</a>
            <a href="bookmarks.html">Bookmarks</a>
            <a href="profile.html">Profile</a>
            <button onclick="logout()" class="danger btn-sm">Logout</button>
        </div>
    </nav>

    <div class="card">
        <h2>Search Notes</h2>
        <form id="searchForm" class="search-form">
            <input type="text" id="searchTitle" placeholder="Title...">
            <input type="text" id="searchSubject" placeholder="Subject...">
            <input type="text" id="searchUploader" placeholder="Uploader...">
            <button type="submit" class="secondary">Search</button>
            <button type="button" onclick="clearSearch()" class="danger">Clear</button>
        </form>
    </div>

    <div class="card">
        <div class="flex-between">
            <h2>All Notes</h2>
            <button onclick="loadNotes()" class="secondary btn-sm">Refresh</button>
        </div>
        <div id="notesList"><p>Loading notes...</p></div>
    </div>
</div>

<div id="editNoteModal" class="modal hidden">
    <div class="modal-content card">
        <h2>Edit Note</h2>
        <form id="editNoteForm">
            <input type="hidden" id="editNoteId">
            <div class="form-group"><label>Title</label><input type="text" id="editTitle" required></div>
            <div class="form-group"><label>Subject</label><input type="text" id="editSubject"></div>
            <div class="form-group"><label>Description</label><textarea id="editDesc" rows="2"></textarea></div>
            <div class="form-group"><label>Replace File (Optional)</label><input type="file" id="editFile"></div>
            <button type="submit">Update Note</button>
            <button type="button" onclick="closeEditModal()" class="secondary">Cancel</button>
        </form>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
