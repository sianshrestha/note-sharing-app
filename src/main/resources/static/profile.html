<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile - ShareMyNotes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <nav class="navbar">
        <h1>📝 ShareMyNotes</h1>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="upload.html">Upload Note</a>
            <a href="bookmarks.html">Bookmarks</a>
            <a href="profile.html">Profile</a>
            <button onclick="logout()" class="danger btn-sm">Logout</button>
        </div>
    </nav>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="card">
            <h2>My Profile Overview</h2>
            <div id="profileDetails"><p>Loading profile...</p></div>
        </div>

        <div class="card">
            <h2>Update Profile</h2>
            <form id="updateProfileForm">
                <div class="form-group"><label>New Username</label><input type="text" id="updateUsername"></div>
                <div class="form-group"><label>New Email</label><input type="email" id="updateEmail"></div>
                <button type="submit">Save Changes</button>
            </form>
            <p style="font-size: 0.8em; color: gray; margin-top: 10px;">Note: Changing your profile will require you to log in again.</p>
        </div>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
